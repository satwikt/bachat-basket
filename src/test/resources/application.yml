spring:
  application:
    name: bachat
  datasource:
    url: jdbc:h2:mem:bachat-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

bachat:
  mode: demo
sarvam:
  api-key: ""
  base-url: https://api.sarvam.ai
  model: saaras:v4
  keyterms: [doodh, bread, packet, loaf, dozen, anda, dahi, paneer]
